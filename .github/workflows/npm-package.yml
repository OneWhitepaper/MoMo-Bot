name: Verify MoMo bot CLI package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - server/cli.ts
      - server/tunnel.ts
      - server/tailscale.ts
      - server/pair-cli.ts
      - scripts/build-npm-package.mjs
      - scripts/bundle-server.mjs
      - .github/workflows/npm-package.yml

permissions:
  contents: read

jobs:
  pack-and-prove:
    name: assemble, pack, run standalone
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: pnpm build:server && pnpm exec vite build && node scripts/build-npm-package.mjs
      - name: Prove the packed tarball runs with no node_modules at all
        run: |
          set -euo pipefail
          cd release/npm && npm pack --silent && cd ../..
          rm -rf /tmp/omb-pack && mkdir -p /tmp/omb-pack && tar -xzf release/npm/momobot-*.tgz -C /tmp/omb-pack
          cd /tmp/omb-pack/package
          # Every check below is a silent grep/test; say which one failed, and what the server said.
          set -x
          trap 'echo "--- serve.log"; cat serve.log 2>/dev/null; echo "--- tunnel.log"; cat tunnel.log 2>/dev/null' ERR
          test ! -d node_modules
          node cli.js --help | grep -q "momobot serve"
          HOME=/tmp/omb-pack/home node cli.js serve --no-pair --port 18799 --data-dir /tmp/omb-pack/data --label ci --public-url https://ci.example > serve.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:18799/api/health >/dev/null && break; sleep 1; done
          # The server answers /api/health before the CLI prints its "running" line, so wait for the line too.
          for i in $(seq 1 30); do grep -q "^Reach .*https://ci.example" serve.log && break; sleep 1; done
          grep -q "^Reach .*https://ci.example" serve.log
          grep -q "Get a pairing code: momobot pair" serve.log
          OMB_PORT=18799 node cli.js account status | grep -q 'Server "ci"'
          OMB_PORT=18799 node cli.js pair --label "CI phone" | grep -q "Link           https://ci.example/pair#code="
          OMB_PORT=18799 node cli.js sessions | grep -q "no paired devices yet"
          # the bundles also run directly by path (the image and docs do that), not only through cli.js:
          # a bundled module with a "run when executed directly" block would fire here
          node dist-server/openmausbot.js --help | grep -q "momobot serve"
          OMB_PORT=1 node dist-server/pair-cli.js > pair.out 2>&1 || true
          cat pair.out
          grep -q "No MoMo bot server is running here" pair.out
          # --tunnel ships its own processes and fails closed without an account
          test -f dist-server/tunnel-guardian.js && test -f dist-server/prepare-cloudflared.js
          test ! -e enterprise && test ! -e dist-server/enterprise
          test -f NOTICE
          test "$(node -p 'require("./package.json").private')" = true
          if HOME=/tmp/omb-pack/home node cli.js serve --tunnel --port 18798 --data-dir /tmp/omb-pack/data2 > tunnel.log 2>&1; then echo "serve --tunnel should refuse without login"; exit 1; fi
          grep -q "run momobot account login first" tunnel.log
          kill %1; wait %1 || true
      - name: Prove an npm install brings the Data engine's native modules
        working-directory: /tmp/omb-pack/package
        run: |
          set -euo pipefail
          npm install --omit=dev --no-audit --no-fund
          node --input-type=module -e '
            import { createRequire } from "node:module";
            import { pathToFileURL } from "node:url";
            const require = createRequire(pathToFileURL("dist-server/index.js"));
            const { DuckDBInstance } = require("@duckdb/node-api");
            const reader = await (await (await DuckDBInstance.create(":memory:")).connect()).runAndReadAll("select 42");
            if (reader.getRows()[0][0] !== 42) throw new Error("DuckDB answered " + JSON.stringify(reader.getRows()));
            const { Resvg } = require("@resvg/resvg-js");
            const png = new Resvg("<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"2\" height=\"2\"/>").render().asPng();
            if (png.subarray(1, 4).toString() !== "PNG") throw new Error("resvg did not render a PNG");
            require("@1password/sdk");
          '
      - name: Save the proven tarball for manual download
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: release/npm/momobot-*.tgz
          if-no-files-found: error
          retention-days: 7
